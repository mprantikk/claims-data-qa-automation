name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit and end-to-end tests
        run: pytest -v
      - name: Run the pipeline on the sample extract
        run: python -m claimsqa run
      - name: Upload QA report
        uses: actions/upload-artifact@v4
        with:
          name: qa-report
          path: reports/
